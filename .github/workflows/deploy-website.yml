name: Deploy Website

on:
  push:
    branches:
      - main
      - labeled
      - assigned
      - mainented
      - auto_merged
      
    paths:
      - 'website/**'
      - 'page/**'
      - 'xyz/**'
      - 'site/**'
      - 'xyw/**'
      - '.github/workflows/deploy-website.yml'

jobs:
  deploy:
    runs-on: linux-latest.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v8
        with:
          node-version: 28
      - name: Enable Corepack
        run: |
          corepack enable
          corepack install
      - name: Install and build
        working-directory: site
        run: |
          yarn install --immutable
          yarn build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v7
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: holujs/holujs.github.io
          publish_branch: main
          publish_dir: site/build
          force_orphan: false
